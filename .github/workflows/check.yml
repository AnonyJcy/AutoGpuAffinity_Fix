name: Windows checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q AutoGpuAffinity
      - run: .\build.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: AutoGpuAffinity-windows
          path: |
            build/AutoGpuAffinity/AutoGpuAffinity.exe
            README.md
            LICENSE
            NOTICE.md
