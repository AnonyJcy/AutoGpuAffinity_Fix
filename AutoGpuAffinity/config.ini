# AutoGpuAffinity_Fix 配置（UTF-8 / UTF-8 BOM 均可，建议用记事本保存）
# 维护与修改：AnonyJcy https://github.com/AnonyJcy/AutoGpuAffinity_Fix
# 首次启动从内置模板生成到 %LOCALAPPDATA%\AutoGpuAffinity_Fix。
[settings]
# auto 自动选择可运行本 Vulkan 场景的最快显卡；也可填唯一显卡名称或完整设备实例 ID。
gpu=auto
# 自动采用主显示器物理分辨率，不受桌面缩放影响。
auto_resolution=true
# 强制无边框全屏，保留多显卡输出兼容性。
force_fullscreen=true
# auto 检测刷新率限制，验证状态条合成路径；always 始终合成；never 不使用状态条。
fullscreen_composition=auto
# 每个测试项预热和正式采集时间（秒）。增强模式每轮都使用相同时间。
cache_duration=5
benchmark_duration=10
# [] 测全部逻辑核心；[0..7] 或 [0,2,3,4,5] 可缩小范围。
# 增强模式只有同时包含两个真实超线程时才测试该组合。
custom_cpus=[]
# 1 Vulkan（推荐）；2 旧版 D3D9（多显卡无法可靠选择渲染卡）。
api=1
# 渲染进程与显卡中断同时绑定到当前测试的单线程或双线程组合。
sync_driver_affinity=true
# true 跳过开始前回车提示，但仍需选择模式和人工确认最终设备绑定。
skip_confirmation=false

[MSI Afterburner]
# 0 不加载；其他数字表示每次驱动重启后加载对应超频预设。
profile=0
location=C:\Program Files (x86)\MSI Afterburner\MSIAfterburner.exe

[xperf]
# 可选高级诊断，需要另装 Windows Performance Toolkit；默认关闭。
enabled=false
location=C:\Program Files (x86)\Windows Kits\10\Windows Performance Toolkit\xperf.exe
save_etls=false

[liblava]
fullscreen=true
# auto_resolution=false 时使用以下分辨率。
x_resolution=1920
y_resolution=1080
# 0 不限制帧率；建议保留，避免无法区分核心表现。
fps_cap=0
triple_buffering=false
